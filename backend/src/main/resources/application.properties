server.port=${PORT:8080}

spring.application.name=finsight-backend

# MongoDB Connection (supports MongoDB Atlas in cloud)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/finsight_db}
spring.data.mongodb.auto-index-creation=true

# Python FastAPI ML Microservice URL
finsight.ml-service.url=${FINSIGHT_ML_SERVICE_URL:http://localhost:8000/api/ml}

# Logging
logging.level.com.finsight=INFO
logging.level.org.springframework.data.mongodb=INFO

# Spring Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
